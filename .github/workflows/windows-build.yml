name: Windows development build
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          architecture: x64
      - name: Verify source checkout
        shell: pwsh
        run: |
          foreach ($file in @('build_windows.bat', 'run_gui.py', 'requirements-build.txt', 'scripts/stage_windows_release.py')) {
            if (!(Test-Path $file)) { throw "Missing source file: $file" }
          }
      - name: Install build and test dependencies
        shell: pwsh
        run: |
          python -m pip install --disable-pip-version-check -r requirements-build.txt -r requirements-preview.txt pytest
      - name: Ensure FFmpeg tools for source tests
        shell: pwsh
        run: |
          $missing = @('ffmpeg', 'ffprobe') | Where-Object { !(Get-Command $_ -ErrorAction SilentlyContinue) }
          if ($missing.Count -gt 0) {
            Write-Host "Installing CI-only FFmpeg tools (not bundled in the release): $($missing -join ', ')"
            choco install ffmpeg --yes --no-progress
            if ($LASTEXITCODE -ne 0) { throw 'Chocolatey FFmpeg installation failed' }
            $chocoRoot = if ($env:ChocolateyInstall) { $env:ChocolateyInstall } else { 'C:\ProgramData\chocolatey' }
            $candidate = Get-ChildItem (Join-Path $chocoRoot 'lib\ffmpeg') -Recurse -File -Filter ffmpeg.exe -ErrorAction SilentlyContinue | Select-Object -First 1
            if ($candidate) {
              $bin = $candidate.DirectoryName
              $env:PATH = "$bin;$env:PATH"
              $bin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            }
          }
          foreach ($exe in @('ffmpeg', 'ffprobe')) {
            if (!(Get-Command $exe -ErrorAction SilentlyContinue)) { throw "CI dependency missing after setup: $exe" }
          }
          if (!(Get-Command ffplay -ErrorAction SilentlyContinue)) { Write-Warning 'ffplay not found on runner; physical playback is not tested in CI' }
      - name: Run source regression tests
        shell: pwsh
        run: |
          # The preceding step ensures FFmpeg is available for regressions.
          if (!(Get-Command ffmpeg -ErrorAction SilentlyContinue)) { throw 'FFmpeg must be installed on the Windows runner to run all source regressions' }
          python -m pytest -q tests tests_classic
      - name: Build and initialize every GUI panel
        shell: pwsh
        run: |
          $env:APT_PYTHON = (Get-Command python).Source
          cmd /c build_windows.bat
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Validate frozen GUI diagnostics
        shell: pwsh
        run: |
          $app = 'dist/AudioPostToolkit/AudioPostToolkit.exe'
          $path = 'dist/AudioPostToolkit/native-diagnostics.json'
          if (!(Test-Path $app) -or !(Test-Path $path)) { throw 'Windows build or diagnostic missing' }
          $report = Get-Content $path -Raw | ConvertFrom-Json
          if (!$report.frozen -or !$report.gui.ok -or $report.gui.tool_panels -lt 1) {
            throw 'Frozen GUI initialization did not pass'
          }
          Write-Host "Verified frozen GUI startup ($($report.gui.tool_panels) panels)"
          Write-Host 'Real audio-device playback and listening QA remain unverified.'
      - name: Smoke-test frozen audio conversion and source preservation
        shell: pwsh
        run: |
          $app = 'dist/AudioPostToolkit/AudioPostToolkit.exe'
          $reportPath = 'dist/AudioPostToolkit/native-audio-smoke.json'
          $absoluteReport = (Join-Path (Get-Location).Path $reportPath)
          $process = Start-Process -FilePath (Resolve-Path $app).Path -ArgumentList @('--smoke-test', ('"' + $absoluteReport + '"')) -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Frozen audio processing failed: exit $($process.ExitCode)" }
          if (!(Test-Path $reportPath)) { throw 'Frozen audio smoke report missing' }
          $report = Get-Content $reportPath -Raw | ConvertFrom-Json
          if (!$report.ok -or !$report.source_sha256_unchanged -or !$report.auto_float_48k_mono -or !$report.pcm24_44100_mono -or !$report.output_collision_avoided -or !$report.stereo_pcm24_preserved) {
            throw 'Frozen audio processing checks failed'
          }
          Write-Host 'Frozen WAV 32f, 24-bit resampling and unchanged-source verification passed.'
      - name: Preserve native diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-diagnostics
          path: |
            dist/AudioPostToolkit/native-diagnostics.json
            dist/AudioPostToolkit/native-audio-smoke.json
          if-no-files-found: warn
      - name: Package development build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/AudioPostToolkit -DestinationPath AudioPostToolkit-Windows-Development.zip
          Get-FileHash AudioPostToolkit-Windows-Development.zip -Algorithm SHA256 | Format-List | Out-File Windows-SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: AudioPostToolkit-Windows-Development
          path: |
            AudioPostToolkit-Windows-Development.zip
            Windows-SHA256.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish downloadable Windows development prerelease
        if: github.ref == 'refs/heads/main'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "dev-build-$env:GITHUB_RUN_NUMBER"
          $notes = "Automated Windows development build from commit $env:GITHUB_SHA. Source tests, frozen GUI initialization and synthetic WAV conversion passed in CI. This is a prerelease, not physical audio-device or professional listening acceptance. Install FFmpeg/FFprobe separately or place them next to the EXE. Keep the entire extracted folder."
          gh release create $tag "AudioPostToolkit-Windows-Development.zip" "Windows-SHA256.txt" --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title "Audio Post Toolkit Windows Dev $env:GITHUB_RUN_NUMBER" --notes $notes --prerelease
          if ($LASTEXITCODE -ne 0) { throw "Failed to publish Windows development prerelease" }
